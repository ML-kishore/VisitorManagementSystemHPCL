<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-In Successful</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .success-card {
            width: 90%;
            max-width: 600px;
            padding: 45px;
            text-align: center;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
            box-sizing: border-box;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #e8f5e9;
            color: #1a8c0b;
            font-size: 45px;
            font-weight: bold;
        }

        h1 {
            margin-top: 25px;
            color: #1a8c0b;
        }

        p {
            color: #555555;
            line-height: 1.6;
        }

        .button-group {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-download {
            padding: 14px 25px;
            background: #0068A5;
            color: #ffffff;
        }

        .btn-dashboard {
            padding: 12px 22px;
            color: #555555;
            border: 1px solid #aaaaaa;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="success-icon">✓</div>

        <h1>Check-In Successful!</h1>

        <p>
            <strong>{{ meeting.visitor_name }}</strong>, your meeting information has been successfully submitted.
        </p>

        <p>The selected host has been notified.</p>

        <div class="button-group">
            <a href="{% url 'download_meeting_pdf' meeting.id %}" class="btn btn-download">
                Download Meeting Details PDF
            </a>
            <a href="{% url 'dashboard' %}" class="btn btn-dashboard">
                Back to Dashboard
            </a>
        </div>
    </div>

</body>
</html>
